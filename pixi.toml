[workspace]
authors = ["Marius S <39998+winding-lines@users.noreply.github.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "bench.mojo"
version = "0.1.0"
description = "A small self-hosted benchmark harness for Mojo — discovery, calibration, repetitions, JSON."
preview = ["pixi-build"]
platforms = ["osx-arm64", "linux-64"]

[tasks]
# Pure Mojo, no FFI — consumers just `-I ../bench.mojo/src`.
test = "mojo run -I src tests/test_bench.mojo"
check-cli = "bash scripts/check_cli.sh"
example = "mojo run -I src tests/example_bench.mojo"

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
# Conda package name is bench-mojo; the Mojo import stays `from bench import …`.
[package]
name = "bench-mojo"
version = "0.1.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/bench"
name = "bench"

[package.host-dependencies]
mojo-compiler = "==1.0.0"

[package.build-dependencies]
mojo-compiler = "==1.0.0"

[package.run-dependencies]
mojo-compiler = ">=1.0.0,<2"

[feature.nightly.dependencies]
modular = ">=26.6.0.dev2026082605,<27"

[feature.stable.dependencies]
mojo-compiler = "==1.0.0"

[environments]
default = ["nightly"]
stable = ["stable"]

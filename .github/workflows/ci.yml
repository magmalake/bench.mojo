name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.env == 'default' && 'nightly' || matrix.env }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        env: [default, stable]
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Pinned: the lock file is written by 0.78.0, and an unpinned pixi
          # rejects it as "lock file not up-to-date with the workspace".
          pixi-version: v0.78.0
          environments: ${{ matrix.env }}

      - name: Unit tests
        run: pixi run -e ${{ matrix.env }} test

      # Covers the __functions_in_module() discovery path and every CLI flag,
      # which the unit tests cannot reach — see tests/example_bench.mojo.
      - name: CLI
        run: pixi run -e ${{ matrix.env }} check-cli
